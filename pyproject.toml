[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-stt-plugin-whisper-lm"
dynamic = ["version"]
description = "A whisper stt plugin for OVOS"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
keywords = ["mycroft", "ovos", "plugin", "stt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    "ovos-utils>=0.8.4,<1.0.0",
    "requests",
    "transformers",
    "kenlm",
    "whisper-lm-transformers",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-stt-plugin-whisper-lm"

[project.entry-points."opm.stt"]
"ovos-stt-plugin-whisper-lm" = "ovos_stt_plugin_whisper_lm:WhisperLMSTT"

[tool.setuptools.dynamic]
version = { attr = "ovos_stt_plugin_whisper_lm.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_stt_plugin_whisper_lm*"]
